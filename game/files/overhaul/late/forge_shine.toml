[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.regex]
id = "forge_shine.plain_draw"
target = "card.lua"
pattern = '''^(?<indent>[\t ]*)if \(self\.edition and self\.edition\.negative\) or \(self\.ability\.name == 'Antimatter' and \(self\.config\.center\.discovered or self\.bypass_discovery_center\)\) then\n(?<body>[\t ]*self\.children\.center:draw_shader\('negative_shine', nil, self\.ARGS\.send_to_shader\)\n)'''
position = "at"
payload = '''
${indent}if ForgeShine and ForgeShine.owns(self) then
${indent}    ForgeShine.draw_plain(self)
${indent}elseif (self.edition and self.edition.negative) or (self.ability.name == 'Antimatter' and (self.config.center.discovered or self.bypass_discovery_center)) then
${body}'''
times = 1
optional = true

[[patches]]
[patches.pattern]
id = "forge_forcedlook.plain_draw"
target = "card.lua"
pattern = "--If the card has any edition/seal, add that here"
position = "before"
payload = '''
            if ForgeForcedLook and ForgeForcedLook.of(self) then ForgeForcedLook.draw_plain(self) end
'''
match_indent = true
times = 1
optional = true

[[patches]]
[patches.pattern]
id = "forge_forcedlook.plain_seal"
target = "card.lua"
pattern = "if self.seal == 'Gold' then G.shared_seals[self.seal]:draw_shader('voucher', nil, self.ARGS.send_to_shader, nil, self.children.center) end"
position = "after"
payload = '''
if ForgeForcedLook and ForgeForcedLook.seal_look(self) then ForgeForcedLook.draw_seal_safe(self) end
'''
match_indent = true
times = 1
optional = true

[[patches]]
[patches.pattern]
id = "forge_forcedlook.plain_back_deck"
target = "card.lua"
pattern = "self.children.back:draw(overlay)"
position = "after"
payload = '''
if ForgeForcedLook then ForgeForcedLook.draw_back_safe(self) end
'''
match_indent = true
times = 1
optional = true

[[patches]]
[patches.pattern]
id = "forge_forcedlook.plain_back"
target = "card.lua"
pattern = "self.children.back:draw_shader('dissolve')"
position = "after"
payload = '''
if ForgeForcedLook then ForgeForcedLook.draw_back_safe(self) end
'''
match_indent = true
times = 1
optional = true
