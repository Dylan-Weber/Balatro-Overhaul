[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.regex]
id = "auto.smods_loc_fr.001"
target = '=[SMODS _ "localization/fr.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*load_success = \{\n)'''
position = "at"
payload = '''
${pre}            artist = { text = { "{C:inactive}Artiste" } },
            artist_credit = { name = "Artiste", text = { "{E:1}#1#{}" } },
            card_extra_chips = { text = { "{C:chips}#1#{} jetons en plus" } },
            card_extra_h_chips = { text = { "{C:chips}#1#{} jetons si gardée en main" } },
            card_extra_h_dollars = { text = { "{C:money}#1#{} si gardée en main en fin de manche" } },
            card_extra_h_mult = { text = { "{C:mult}#1#{} Multi en plus si gardée en main" } },
            card_extra_h_x_chips = { text = { "{X:chips,C:white}X#1#{} jetons en plus si gardée en main" } },
            card_extra_h_x_mult = { text = { "{X:mult,C:white}X#1#{} Multi en plus si gardée en main" } },
            card_extra_mult = { text = { "{C:mult}#1#{} Multi en plus" } },
            card_extra_p_dollars = { text = { "{C:money}#1#{} quand elle marque" } },
            card_extra_repetitions = { text = { "Redéclenche cette", "carte {C:attention}#1#{} #2#" } },
            card_extra_score = { text = { "{C:purple}#1#{} de score en plus" } },
            card_extra_x_chips = { text = { "{X:chips,C:white}X#1#{} jetons en plus" } },
            card_extra_x_mult = { text = { "{X:mult,C:white}X#1#{} Multi en plus" } },
            card_extra_x_score = { text = { "{X:purple,C:white}X#1#{} de score en plus" } },
            card_h_x_chips = { text = { "{X:chips,C:white}X#1#{} jetons si gardée en main" } },
            card_h_x_mult = { text = { "{X:mult,C:white}X#1#{} Multi si gardée en main" } },
            card_score = { text = { "{C:purple}#1#{} de score" } },
            card_x_chips = { text = { "{X:chips,C:white}X#1#{} jetons" } },
            card_x_mult = { text = { "{X:mult,C:white}X#1#{} Multi" } },
            card_x_score = { text = { "{X:purple,C:white}X#1#{} de score" } },
            generic_card_limit = { name = "Limite de cartes", text = { "{C:dark_edition}#1#{} emplacement de zone" } },
            generic_card_limit_pc = { name = "Taille de la main", text = { "{C:dark_edition}#1#{} carte en main" } },
            generic_card_limit_pc_plural = { name = "Taille de la main", text = { "{C:dark_edition}#1#{} cartes en main" } },
            generic_card_limit_plural = { name = "Limite de cartes", text = { "{C:dark_edition}#1#{} emplacements de zone" } },
            generic_extra_slots = { name = "Emplacements pris", text = { "Prend {C:dark_edition}#1#{} emplacements" } },
            generic_extra_slots_pc = { name = "Place en main", text = { "Prend {C:dark_edition}#1#{} places en main" } },
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_loc_fr.002"
target = '=[SMODS _ "localization/fr.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*e_negative_playing_card = \{\n)'''
position = "at"
payload = '''
${pre}            e_negative_generic = {
                name = "Négatif",
                text = { "{C:dark_edition}+#1#{} emplacement de zone" },
            },
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_loc_fr.003"
target = '=[SMODS _ "localization/fr.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*b_mods = 'Mods',\n)'''
position = "at"
payload = '''
${pre}            b_limit = "Jusqu'à ",
            b_priority = "Priorité : ",
            b_retrigger_plural = "fois",
            b_retrigger_single = "fois",
            b_run_select_reduce = "Mode performance du choix de partie",
            b_run_select_reduce_info = { "Tire moins de cartes", "et retire les animations" },
            b_vanilla_run_select = "Choix de partie d'origine",
            b_vanilla_run_select_info = { "Ignoré si des mods ajoutent", "des pages en plus" },
            b_vanilla_stake = "Affichage des mises d'origine",
            b_vanilla_stake_info = { "Active ou non l'affichage personnalisé", "des mises dans les infos de partie" },
            k_enhanced = "Amélioration",
            run_select_deck_choice = "Choisir un jeu",
            run_select_deck_choice_random = "Jeu au hasard",
            run_select_locked_stake = "Verrouillée",
            run_select_locked_stake_and = " et ",
            run_select_locked_stake_message = "Gagnez avec ce jeu en ",
            run_select_nothing = "Rien",
            run_select_play = "Jouer",
            run_select_quick_start = "Dernière partie",
            run_select_selected = "CHOISI",
            run_select_stake_choice = "Choisir une mise",
            run_select_stake_choice_random = "Mise au hasard",
            run_setup_enable_seed = "Activer la seed",
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_loc_fr.004"
target = '=[SMODS _ "localization/fr.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*c_types = '#1# Types',\n)'''
position = "at"
payload = '''
${pre}            a_score = "#1# de score",
            a_xscore = "X#1# de score",
            a_xscore_minus = "-X#1# de score",
            a_blind_size = "#1# à la taille de la blinde",
            a_xblind_size = "X#1# à la taille de la blinde",
            a_xblind_size_minus = "-X#1# à la taille de la blinde",
            smods_version_mismatch = {
                "Votre version de Steamodded a changé",
                "depuis le début de cette partie !",
                "La continuer peut causer des",
                "comportements inattendus et des plantages.",
                "Version de départ : #1#",
                "Version actuelle : #2#",
            },
${post}'''
times = 1
