[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.001"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*if blacklist ~= nil and not force then return blacklist end\n)'''
position = "at"
payload = '''
${pre}    if MODLOADER and MODLOADER.active then return {} end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.002"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>[\t ]*local function addToBlacklist\(name\)\n)(?<post>)'''
position = "at"
payload = '''
${pre}    if MODLOADER and MODLOADER.set_enabled then
        MODLOADER.set_enabled(name, false)
        return
    end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.003"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*local function removeFromBlacklist\(name\)\n)'''
position = "at"
payload = '''
${pre}local function enableFolder(name)
    if MODLOADER and MODLOADER.set_enabled then
        MODLOADER.set_enabled(name, true)
        return
    end
    NFS.remove(SMODS.MODS_DIR.. "/" .. name ..'/.lovelyignore')
end

${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.004"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>[\t ]*local function removeFromBlacklist\(name\)\n)(?<post>)'''
position = "at"
payload = '''
${pre}    if MODLOADER and MODLOADER.set_enabled then
        MODLOADER.set_enabled(name, true)
        return
    end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.005"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*local parts = \{\}\n)'''
position = "at"
payload = '''
${pre}                if type(v) == 'table' then
                    local s = tostring(v.id or v.name or '')
                    if v.min_version then s = s .. ' (>=' .. tostring(v.min_version) .. ')' end
                    if v.max_version then s = s .. ' (<=' .. tostring(v.max_version) .. ')' end
                    v = s
                end
                v = tostring(v)
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.006"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>)[\t ]*x\.id = part:match '\^\(\[\^\(%s\]\+\)'\n(?<post>)'''
position = "at"
payload = '''
${pre}                    x.id = part:match '^%s*([^(%s<>=]+)'
                    if not part:find('%(') then
                        local bop, bver = part:match '^%s*[^%s(<>=]+%s*([<>=][<>=])%s*(%S+)'
                        if bop then part = part .. '(' .. bop .. bver .. ')' end
                    end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.007"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>)[\t ]*local file_type = NFS\.getInfo\(file_path\)\.type\n(?<post>)'''
position = "at"
payload = '''
${pre}            local file_info = NFS.getInfo(file_path)
            local file_type = file_info and file_info.type
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.008"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*if not NFS\.getInfo\(mod\.path\.\.mod\.main_file\) then\n)'''
position = "at"
payload = '''
${pre}                    if not NFS.getInfo(mod.path..mod.main_file) then
                        local found, dir = "", mod.path
                        for part in mod.main_file:gmatch("[^/\\]+") do
                            local hit
                            for _, item in ipairs(NFS.getDirectoryItems(dir) or {}) do
                                if item:lower() == part:lower() then hit = item break end
                            end
                            if not hit then found = nil break end
                            found = found == "" and hit or (found .. "/" .. hit)
                            dir = dir .. hit .. "/"
                        end
                        if found and found ~= "" and NFS.getInfo(mod.path..found) then mod.main_file = found end
                    end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.009"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*if mod\.icon_path then\n)'''
position = "at"
payload = '''
${pre}            if LOADING_SCREEN then LOADING_SCREEN.draw() end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.010"
