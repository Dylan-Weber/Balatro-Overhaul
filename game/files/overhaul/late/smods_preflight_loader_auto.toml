pattern = '''^(?<pre>)(?<post>[\t ]*if not path or path == "" then\n)'''
position = "at"
payload = '''
${pre}    if LOADING_SCREEN then LOADING_SCREEN.draw() end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.011"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>[\t ]*SMODS\.booted = true\n)(?<post>)'''
position = "at"
payload = '''
${pre}    if LOADING_SCREEN then LOADING_SCREEN.finish() end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_preflight_loader.012"
target = '=[lovely SMODS.preflight.loader "src/preflight/loader.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*removeFromBlacklist = removeFromBlacklist,\n)'''
position = "at"
payload = '''
${pre}    enableFolder = enableFolder,
${post}'''
times = 1
