[manifest]
version = "1.0.0"
priority = 0

# Compile Steamodded mod shaders at high float precision on phones (OpenGL ES), where LOVE
# defaults to medium precision and mod shader math written for desktop can overflow it.
# See functions/mod_shader_precision.lua.
[[patches]]
[patches.pattern]
id = "mod_shader_precision.highp_on_gles"
target = '=[SMODS _ "src/game_object.lua"]'
pattern = "G.SHADERS[self.key] = love.graphics.newShader(file)"
position = "at"
payload = "G.SHADERS[self.key] = require(\"functions/mod_shader_precision\").compile(file)"
match_indent = true
times = 1
