${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_overrides.022"
target = '=[SMODS _ "src/overrides.lua"]'
pattern = '''^(?<pre>[\t ]*if old_success then return old_shader end\n)(?<post>)'''
position = "at"
payload = '''
${pre}
        local stripped, removed = strip_builtin_redefs("\n" .. code)
        if removed > 0 then
            local ok_s, s_shader = pcall(newShader, assert(lovely.apply_patches("GLSL_ES_PATCHES.fs", stripped)))
            if ok_s then return s_shader end
            ok_s, s_shader = pcall(newShader, stripped)
            if ok_s then return s_shader end
        end
${post}'''
times = 1
