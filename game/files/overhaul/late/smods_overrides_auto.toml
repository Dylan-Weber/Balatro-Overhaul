[[patches]]
[patches.regex]
id = "auto.smods_overrides.019"
target = '=[SMODS _ "src/overrides.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*function love\.graphics\.newShader\(code, other_code\)\n)'''
position = "at"
payload = '''
${pre}    local glsl_builtins = {}
    for w in ("radians degrees sin cos tan asin acos atan pow exp log exp2 log2 sqrt inversesqrt abs sign floor ceil fract mod min max clamp mix step smoothstep length distance dot cross normalize faceforward reflect refract matrixCompMult lessThan lessThanEqual greaterThan greaterThanEqual equal notEqual any all not"):gmatch("%S+") do glsl_builtins[w] = true end
    local function strip_builtin_redefs(src)
        local out, n = src, 0
        for _, ty in ipairs({"float", "number", "vec2", "vec3", "vec4", "int", "bool"}) do
            out = out:gsub("\n([ \t]*" .. ty .. "[ \t]+)([%a_][%w_]*)([ \t]*%b()[%s]*)(%b{})", function(head, name, args, body)
                if glsl_builtins[name] then n = n + 1; return "\n" end
            end)
        end
        return out, n
    end
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_overrides.020"
target = '=[SMODS _ "src/overrides.lua"]'
pattern = '''^(?<pre>)(?<post>[\t ]*-- this only supports a single argument passed as code, file names are not supported\n)'''
position = "at"
payload = '''
${pre}        if type(code) == "string" and not other_code and not string.find(code, '\n') and SMODS.renderer_name() == "OpenGL ES" and love.filesystem.getInfo(code, "file") then
            code = love.filesystem.read(code) or code
        end
${post}'''
times = 1

